<title>ProBikeStock — Suivi Muscu Cyclisme</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
  /* ============================ TOKENS ============================ */
  :root {
    --bg:        #f3f7f9;
    --surface:   #ffffff;
    --surface-2: #eef3f6;
    --surface-3: #e4edf2;
    --border:    #d2e0e8;
    --border-2:  #bcd0dc;
    --text:      #002843;
    --muted:     #5a7688;
    --faint:     #86a1b1;
    --accent:      #C6F000;
    --accent-ink:  #002843;   /* text on lime */
    --accent-text: #47690a;   /* lime-ish text usable on light ground */
    --good:  #12805c;
    --warn:  #b26a00;
    --danger:#c81721;
    --good-bg:  #d9f2e8;
    --warn-bg:  #fbecd2;
    --danger-bg:#fbdcde;
    --shadow: 0 1px 2px rgba(0,40,67,.06), 0 8px 24px rgba(0,40,67,.06);
    --radius: 14px;
    --radius-sm: 9px;
    --mono: 'Space Mono', ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, monospace;
    --disp: 'Archivo', 'Helvetica Neue', system-ui, -apple-system, sans-serif;
    --body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:        #00121f;
      --surface:   #002843;
      --surface-2: #063351;
      --surface-3: #0b3f60;
      --border:    #13446a;
      --border-2:  #1d567f;
      --text:      #e9f3f9;
      --muted:     #94b3c6;
      --faint:     #5e829a;
      --accent:      #C6F000;
      --accent-ink:  #002843;
      --accent-text: #C6F000;
      --good:  #3ddc97;
      --warn:  #f5a623;
      --danger:#ff5b62;
      --good-bg:  #063a2c;
      --warn-bg:  #3d2e08;
      --danger-bg:#3d1215;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  /* explicit theme toggles win over the media query, both directions */
  :root[data-theme="light"] {
    --bg:#f3f7f9; --surface:#fff; --surface-2:#eef3f6; --surface-3:#e4edf2;
    --border:#d2e0e8; --border-2:#bcd0dc; --text:#002843; --muted:#5a7688; --faint:#86a1b1;
    --accent-text:#47690a; --good:#12805c; --warn:#b26a00; --danger:#c81721;
    --good-bg:#d9f2e8; --warn-bg:#fbecd2; --danger-bg:#fbdcde;
    --shadow:0 1px 2px rgba(0,40,67,.06), 0 8px 24px rgba(0,40,67,.06);
  }
  :root[data-theme="dark"] {
    --bg:#00121f; --surface:#002843; --surface-2:#063351; --surface-3:#0b3f60;
    --border:#13446a; --border-2:#1d567f; --text:#e9f3f9; --muted:#94b3c6; --faint:#5e829a;
    --accent-text:#C6F000; --good:#3ddc97; --warn:#f5a623; --danger:#ff5b62;
    --good-bg:#063a2c; --warn-bg:#3d2e08; --danger-bg:#3d1215;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }

  /* ============================ BASE ============================ */
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--body); line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    font-size: 15px;
  }
  h1,h2,h3,h4 { font-family: var(--disp); font-weight: 800; margin: 0; letter-spacing: -.02em; line-height: 1.1; text-wrap: balance; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: 15px; }
  a { color: var(--accent-text); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  ::selection { background: var(--accent); color: var(--accent-ink); }

  /* ============================ SHELL ============================ */
  .app { max-width: 1080px; margin: 0 auto; padding: 0 16px 96px; }
  header.top {
    position: sticky; top: 0; z-index: 40;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    margin: 0 -16px 20px; padding: 12px 16px;
  }
  .top-row { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
  .brand { display: flex; align-items: baseline; gap: 9px; }
  .brand .mark {
    font-family: var(--disp); font-weight: 800; font-size: 19px; letter-spacing: -.03em;
  }
  .brand .mark b { color: var(--accent-text); }
  .brand .tag {
    font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--faint); border-left: 1px solid var(--border-2); padding-left: 9px;
  }
  .top-spacer { flex: 1; }
  .icon-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    width: 38px; height: 38px; border-radius: 10px; font-size: 16px; display: grid; place-items: center;
    transition: border-color .15s, background .15s;
  }
  .icon-btn:hover { border-color: var(--border-2); }

  nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-top: 12px; max-width:1080px; }
  nav.tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; background: transparent; border: 0; color: var(--muted);
    padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 14px;
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .tab:hover { color: var(--text); background: var(--surface-2); }
  .tab.active { background: var(--accent); color: var(--accent-ink); }
  .tab .tab-ic { font-size: 15px; }

  /* ============================ PRIMITIVES ============================ */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .pad { padding: 18px; }
  .grid { display: grid; gap: 14px; }
  .row { display: flex; gap: 12px; }
  .between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .wrap { flex-wrap: wrap; }
  .eyebrow {
    font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .14em;
    color: var(--faint); margin: 0 0 3px;
  }
  .muted { color: var(--muted); }
  .btn {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 9px 15px; border-radius: 10px; font-weight: 650; font-size: 14px;
    display: inline-flex; align-items: center; gap: 7px; transition: border-color .15s, background .15s, transform .05s;
  }
  .btn:hover { border-color: var(--border-2); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 750; }
  .btn.primary:hover { filter: brightness(1.04); }
  .btn.ghost { background: transparent; }
  .btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
  .btn.danger { color: var(--danger); }
  .btn:focus-visible, .tab:focus-visible, .icon-btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono);
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700;
    padding: 3px 9px; border-radius: 999px; border: 1px solid transparent;
  }
  .pill.good { background: var(--good-bg); color: var(--good); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.danger { background: var(--danger-bg); color: var(--danger); }
  .pill.plain { background: var(--surface-2); color: var(--muted); border-color: var(--border); }
  .pill.accent { background: var(--accent); color: var(--accent-ink); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  label.field { display: grid; gap: 5px; font-size: 13px; color: var(--muted); font-weight: 600; }
  input[type=text], input[type=number], input[type=date], select, textarea {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 9px 11px; border-radius: 9px; width: 100%; transition: border-color .15s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 62px; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 12px; }
  .stat { padding: 15px 16px; }
  .stat .k { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--faint); }
  .stat .v { font-family: var(--disp); font-weight: 800; font-size: 30px; letter-spacing: -.02em; margin-top: 4px; line-height: 1; }
  .stat .v small { font-size: 15px; color: var(--muted); font-weight: 700; letter-spacing: 0; }
  .stat .sub { font-size: 12.5px; color: var(--muted); margin-top: 5px; }

  /* ============================ CALENDAR ============================ */
  .cal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  @media (max-width: 720px) { .week-grid { grid-template-columns: repeat(2, 1fr); } }
  .day {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    min-height: 130px; padding: 8px; display: flex; flex-direction: column; gap: 7px;
    transition: border-color .12s, background .12s;
  }
  .day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .day.drop-hot { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
  .day-hd { display: flex; align-items: baseline; justify-content: space-between; }
  .day-hd .dow { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--faint); }
  .day-hd .dnum { font-family: var(--disp); font-weight: 800; font-size: 15px; }
  .day-add { border: 1px dashed var(--border-2); background: transparent; color: var(--faint);
    border-radius: 8px; padding: 4px; font-size: 12px; font-weight: 600; margin-top: auto; }
  .day-add:hover { color: var(--accent-text); border-color: var(--accent); }

  .sess {
    border-radius: 9px; padding: 8px 9px; cursor: grab; border: 1px solid var(--border);
    background: var(--surface-2); position: relative; user-select: none;
  }
  .sess:active { cursor: grabbing; }
  .sess.velo { border-left: 3px solid var(--warn); }
  .sess.muscu { border-left: 3px solid var(--accent); }
  .sess.done { opacity: .62; }
  .sess.skipped { opacity: .5; }
  .sess .s-name { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 5px; }
  .sess .s-meta { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .sess .s-status { position: absolute; top: 6px; right: 7px; font-size: 11px; }

  /* ============================ EXERCISE LOG ============================ */
  .ex-block { border: 1px solid var(--border); border-radius: 11px; padding: 12px; background: var(--surface); }
  .ex-block + .ex-block { margin-top: 10px; }
  .set-table { width: 100%; border-collapse: collapse; }
  .set-table th { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--faint); text-align: left; font-weight: 700; padding: 4px 6px; }
  .set-table td { padding: 3px 6px; }
  .set-table input, .set-table select { padding: 6px 8px; text-align: center; }
  .set-table input { width: 100%; }
  .set-no { font-family: var(--mono); color: var(--faint); font-size: 12px; width: 26px; text-align: center; }
  .e1rm-badge { font-family: var(--mono); font-size: 12px; color: var(--accent-text); font-weight: 700; }

  /* ============================ MODAL ============================ */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,18,31,.55); backdrop-filter: blur(3px);
    display: flex; align-items: flex-start; justify-content: center; padding: 24px 14px; z-index: 100;
    overflow-y: auto;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--border-2); border-radius: 16px;
    width: 100%; max-width: 640px; box-shadow: 0 20px 60px rgba(0,0,0,.4); margin: auto;
  }
  .modal-hd { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); border-radius: 16px 16px 0 0; z-index: 2; }
  .modal-bd { padding: 18px; display: grid; gap: 15px; }
  .modal-ft { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; position: sticky; bottom: 0; background: var(--surface); border-radius: 0 0 16px 16px; }

  /* ============================ CHART ============================ */
  .chart-wrap { overflow-x: auto; }
  svg.chart { display: block; width: 100%; height: auto; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }

  /* ============================ PLAN ============================ */
  .phase { border-left: 3px solid var(--border-2); padding: 4px 0 4px 16px; position: relative; }
  .phase::before { content:''; position: absolute; left: -6px; top: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--border-2); }
  .phase.active { border-color: var(--accent); }
  .phase.active::before { background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 999px;
    font-weight: 650; font-size: 14px; box-shadow: var(--shadow); opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .empty { text-align: center; color: var(--muted); padding: 34px 16px; }
  .empty .big { font-size: 30px; margin-bottom: 6px; }
  .hr { height: 1px; background: var(--border); border: 0; margin: 4px 0; }
  .list-clean { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .kbd { font-family: var(--mono); font-size: 11px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  .hidden { display: none !important; }
</style>

<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <span class="mark">by<b>probikestock</b></span>
        <span class="tag">Muscu · Cyclisme</span>
      </div>
      <span class="top-spacer"></span>
      <button class="icon-btn" id="themeBtn" title="Basculer thème clair/sombre" aria-label="Basculer le thème">◐</button>
    </div>
    <nav class="tabs" id="tabs" role="tablist">
      <button class="tab active" data-tab="board"><span class="tab-ic">◎</span>Tableau de bord</button>
      <button class="tab" data-tab="calendar"><span class="tab-ic">▦</span>Calendrier</button>
      <button class="tab" data-tab="progress"><span class="tab-ic">▲</span>Progression</button>
      <button class="tab" data-tab="plan"><span class="tab-ic">◈</span>Plan</button>

    </nav>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   ProBikeStock — Suivi Muscu Cyclisme
   Persistance : localStorage  (+ export / import JSON versionné Git)
   ============================================================ */

const STORE_KEY = "pbs_muscu_v1";
const APP_VERSION = 1;

/* ---------- utilitaires date ---------- */
const DOW = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const MONTHS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function iso(d){ const z=new Date(d); z.setMinutes(z.getMinutes()-z.getTimezoneOffset()); return z.toISOString().slice(0,10); }
function today(){ return iso(new Date()); }
function parseISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function mondayOf(s){ const d=parseISO(s); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return iso(d); }
function fmtDate(s){ const d=parseISO(s); return `${DOW[(d.getDay()+6)%7]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function fmtShort(s){ const d=parseISO(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }

/* ---------- bibliothèque d'exercices par défaut (issue de la recherche) ---------- */
const DEFAULT_EXERCISES = [
  { id:"squat",       name:"Squat / Demi-squat",         cat:"force",      group:"Jambes",       uni:false, weighted:true },
  { id:"presse1j",    name:"Presse à cuisses (1 jambe)",  cat:"force",      group:"Jambes",       uni:true,  weighted:true },
  { id:"bulgare",     name:"Fente bulgare",               cat:"force",      group:"Jambes",       uni:true,  weighted:true },
  { id:"sdtroumain",  name:"Soulevé de terre roumain",    cat:"force",      group:"Chaîne post.", uni:false, weighted:true },
  { id:"hipthrust",   name:"Hip thrust",                  cat:"force",      group:"Chaîne post.", uni:false, weighted:true },
  { id:"mollets",     name:"Mollets debout",              cat:"force",      group:"Jambes",       uni:false, weighted:true },
  { id:"copenhagen",  name:"Copenhagen plank",            cat:"prevention", group:"Gainage",      uni:true,  weighted:false },
  { id:"pallof",      name:"Pallof press",                cat:"prevention", group:"Gainage",      uni:true,  weighted:true },
  { id:"deadbug",     name:"Dead bug",                    cat:"prevention", group:"Gainage",      uni:false, weighted:false },
  { id:"glutebridge", name:"Pont fessier (1 jambe)",      cat:"prevention", group:"Fessiers",     uni:true,  weighted:false },
];

/* ---------- phases de périodisation (issues de la recherche) ---------- */
const PHASES = [
  { key:"prepa",      name:"Adaptation anatomique", weeks:4, scheme:"3 × 10–12 RM · RPE 6–7 · ~65 %",
    desc:"Technique, tendons, base musculaire. Volume élevé, charge moyenne." },
  { key:"force",      name:"Force maximale",        weeks:7, scheme:"4–6 RM · RPE 8–9 · concentrique explosif",
    desc:"Cœur du bloc. Charge lourde ≥ 80 %, volume réduit. Le gain de puissance vient d'ici." },
  { key:"conversion", name:"Conversion / puissance", weeks:4, scheme:"lourd + explosif à vitesse max",
    desc:"Transformer la force en puissance spécifique avant la reprise." },
  { key:"maintien",   name:"Maintien en saison",    weeks:0, scheme:"1 ×/sem · volume réduit, intensité lourde",
    desc:"En course : 1 séance/sem suffit à préserver les gains. Sans entretien : détraînement en ~2 mois." },
];

/* ---------- modèles de séance muscu (2×/sem) ---------- */
function templateSessions(){
  return {
    A: { label:"Séance A — Bilatéral lourd", exos:["squat","sdtroumain","copenhagen","pallof"] },
    B: { label:"Séance B — Unilatéral + fessiers", exos:["presse1j","bulgare","hipthrust","glutebridge","deadbug"] },
  };
}

/* ============================================================
   ÉTAT
   ============================================================ */
let state = load();

function defaultState(){
  return {
    version: APP_VERSION,
    profile: { name:"", bodyweight:null, planStart: today(), muscuDays:[1,4] /* Mar, Ven (0=Lun) */ },
    exercises: DEFAULT_EXERCISES.map(e=>({...e})),
    sessions: [],
    ui: { calWeek: mondayOf(today()), progExo:"squat" },
  };
}
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultState();
    const s = JSON.parse(raw);
    return migrate(s);
  }catch(e){ console.warn("load fail",e); return defaultState(); }
}
function migrate(s){
  const base = defaultState();
  s = Object.assign({}, base, s);
  s.profile = Object.assign({}, base.profile, s.profile||{});
  s.ui = Object.assign({}, base.ui, s.ui||{});
  if(!Array.isArray(s.exercises) || !s.exercises.length) s.exercises = base.exercises;
  if(!Array.isArray(s.sessions)) s.sessions = [];
  return s;
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){ toast("⚠️ Sauvegarde impossible (stockage plein)"); }
}
function exById(id){ return state.exercises.find(e=>e.id===id); }

/* estimation 1RM — formule d'Epley */
function e1rm(weight, reps){
  if(!weight || !reps) return 0;
  if(reps===1) return weight;
  return Math.round(weight * (1 + reps/30));
}
/* meilleur e1RM d'une entrée d'exercice */
function bestE1rm(entry){
  let best=0;
  (entry.sets||[]).forEach(st=>{ const v=e1rm(+st.weight, +st.reps); if(v>best) best=v; });
  return best;
}
function sessionTonnage(sess){
  let t=0;
  (sess.entries||[]).forEach(en=>{
    (en.sets||[]).forEach(st=>{ t += (+st.weight||0) * (+st.reps||0); });
  });
  return t;
}

/* ============================================================
   RENDU — routeur
   ============================================================ */
let currentTab = "board";
const view = document.getElementById("view");

function render(){
  save();
  if(currentTab==="board")    view.innerHTML = renderBoard();
  if(currentTab==="calendar") { view.innerHTML = renderCalendar(); wireCalendar(); }
  if(currentTab==="progress") { view.innerHTML = renderProgress(); wireProgress(); }
  if(currentTab==="plan")     view.innerHTML = renderPlan();
  if(currentTab==="data")     { view.innerHTML = renderData(); wireData(); }
}

document.getElementById("tabs").addEventListener("click", e=>{
  const b = e.target.closest(".tab"); if(!b) return;
  currentTab = b.dataset.tab;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t===b));

});

   ============================================================ */
function currentPhaseInfo(){
  const start = state.profile.planStart;
  const daysIn = Math.floor((parseISO(today()) - parseISO(start)) / 86400000);
  if(daysIn < 0) return { phase:null, weekNo:0, daysToStart:-daysIn };
  let acc=0, weekNo = Math.floor(daysIn/7)+1;
  for(const p of PHASES){
    if(p.weeks===0) return { phase:p, weekNo, weekInPhase:weekNo-acc, totalWeeks:acc };
    if(daysIn < (acc+p.weeks)*7) return { phase:p, weekNo, weekInPhase:(weekNo-acc), totalWeeks:acc+p.weeks };
    acc += p.weeks;
  }
  return { phase: PHASES[PHASES.length-1], weekNo, weekInPhase:weekNo-acc };
}

function renderBoard(){
  const done = state.sessions.filter(s=>s.type==="muscu" && s.status==="done");
  const upcoming = state.sessions
    .filter(s=> s.status!=="done" && s.status!=="skipped" && s.date>=today())
    .sort((a,b)=> a.date.localeCompare(b.date));
  const next = upcoming[0];
  const ph = currentPhaseInfo();

  // stats
  const now = new Date();
  const weekStart = mondayOf(today());
  const thisWeek = state.sessions.filter(s=>s.type==="muscu" && s.status==="done" && s.date>=weekStart);
  const totalTonnage = done.reduce((a,s)=>a+sessionTonnage(s),0);
  const streak = computeStreakWeeks();

  // PR récents (top e1RM par exo, sur les 60 derniers jours prend le dernier record)
  const prs = computePRs().filter(p=>p.e1rm>0).slice(0,4);

  let phaseCard;

    </div>`;
  } else if(ph.phase){
    const idx = PHASES.indexOf(ph.phase);
    phaseCard = `<div class="card pad">
      <div class="between">
        <div>
          <div class="eyebrow">Phase en cours · semaine ${ph.weekNo}</div>
          <h3>${ph.phase.name}</h3>
        </div>
        <span class="pill accent">${idx+1}/${PHASES.length}</span>
      </div>
      <p class="mono" style="color:var(--accent-text);font-size:13px;margin:10px 0 4px">${ph.phase.scheme}</p>
      <p class="muted" style="margin:0">${ph.phase.desc}</p>
    </div>`;
  } else phaseCard = "";

  return `
  <div class="grid">
    <div class="between wrap">
      <div>
        <div class="eyebrow">La sortie de la semaine, côté salle</div>
        <h1 style="font-size:26px">Bonjour${state.profile.name?`, ${escapeHtml(state.profile.name)}`:""} 👋</h1>
      </div>
      <button class="btn primary" onclick="quickNewSession()">+ Nouvelle séance</button>
    </div>

    ${phaseCard}

    <div class="stat-grid">
      ${stat("Séances muscu", done.length, "réalisées au total")}
      ${stat("Cette semaine", `${thisWeek.length}<small>/2</small>`, thisWeek.length>=2?"objectif atteint ✓":"objectif hebdo")}
      ${stat("Régularité", `${streak}<small> sem</small>`, "avec ≥ 1 séance")}
      ${stat("Tonnage cumulé", `${Math.round(totalTonnage/1000)}<small> t</small>`, "charge × reps soulevée")}
    </div>

    <div class="grid" style="grid-template-columns: 1.3fr 1fr; align-items:start" id="boardCols">
      <div class="card pad">
        <div class="between"><h3>Prochaine séance</h3>${next?`<span class="pill plain">${fmtShort(next.date)}</span>`:""}</div>
        ${ next ? sessionPreview(next) : `<div class="empty"><div class="big">🗓️</div>Aucune séance à venir.<br><button class="btn sm" style="margin-top:10px" onclick="quickNewSession()">Planifier une séance</button></div>` }
      </div>

      <div class="card pad">
        <h3>Records estimés (1RM)</h3>
        ${ prs.length ? `<ul class="list-clean" style="margin-top:12px">${prs.map(p=>`
          <li class="between" style="border-bottom:1px solid var(--border);padding-bottom:8px">
            <span>${escapeHtml(p.name)}</span>
            <span class="num" style="font-weight:700">${p.e1rm} <span class="muted" style="font-weight:400">kg</span></span>
          </li>`).join("")}</ul>`
          : `<div class="empty" style="padding:22px 8px"><div class="big">🏋️</div><span style="font-size:13px">Enregistre des séries avec charge pour voir tes records.</span></div>` }

function stat(k,v,sub){ return `<div class="card stat"><div class="k">${k}</div><div class="v num">${v}</div><div class="sub">${sub}</div></div>`; }

function sessionPreview(s){
  const exos = (s.entries||[]).map(en=>{ const ex=exById(en.exerciseId); return ex?ex.name:en.custom||"?"; });
  return `<div style="margin-top:12px" class="grid">
    <div class="between">
      <div><b>${escapeHtml(s.title||defaultTitle(s))}</b><div class="muted" style="font-size:13px">${fmtDate(s.date)}</div></div>
      <span class="pill ${s.type==='muscu'?'accent':'warn'}">${s.type==='muscu'?'Muscu':'Vélo'}</span>
    </div>
    ${ exos.length ? `<div class="muted" style="font-size:13px">${exos.map(escapeHtml).join(" · ")}</div>` : "" }
    <div class="row">
      <button class="btn primary sm" onclick="openSession('${s.id}')">${s.type==='muscu'?'Ouvrir & enregistrer':'Ouvrir'}</button>
      <button class="btn sm" onclick="setStatus('${s.id}','done')">Marquer fait ✓</button>
    </div>
  </div>`;
}
function computeStreakWeeks(){
  let w = mondayOf(today()), streak=0;
  for(let i=0;i<52;i++){
    const ws=w, we=addDays(w,6);
    const has = state.sessions.some(s=>s.type==="muscu"&&s.status==="done"&&s.date>=ws&&s.date<=we);
    if(has) streak++; else if(i>0) break; else { w=addDays(w,-7); continue; }
    w=addDays(w,-7);
  }
  return streak;
}
function computePRs(){
  const map = {};
  state.sessions.filter(s=>s.status==="done").forEach(s=>{
    (s.entries||[]).forEach(en=>{
      const ex=exById(en.exerciseId); if(!ex||!ex.weighted) return;
      const b=bestE1rm(en);
      if(b>(map[en.exerciseId]?.e1rm||0)) map[en.exerciseId]={ id:en.exerciseId, name:ex.name, e1rm:b, date:s.date };
    });
  });
  return Object.values(map).sort((a,b)=>b.e1rm-a.e1rm);
}

function renderDayCol(d){
  const sessions = state.sessions.filter(s=>s.date===d).sort((a,b)=>(a.type>b.type?1:-1));
  const isToday = d===today();
  const dd=parseISO(d);
  return `<div class="day ${isToday?'today':''}" data-date="${d}">

function renderSessChip(s){
  const statusIc = s.status==="done"?"✓" : s.status==="skipped"?"✕" : "";
  const meta = s.type==="muscu"
    ? `${(s.entries||[]).length} exo${(s.entries||[]).length>1?"s":""}`
    : (s.strava ? `${s.strava.distance_km} km · ${s.strava.elevation} m` : (s.duration?`${s.duration}′`:"vélo"));
  return `<div class="sess ${s.type} ${s.status}" draggable="true" data-id="${s.id}" onclick="openSession('${s.id}')">
    <div class="s-name">${escapeHtml(s.title||defaultTitle(s))}</div>
    <div class="s-meta">${meta}</div>

}
function wireCalendar(){
  let dragId=null;
  document.querySelectorAll(".sess").forEach(el=>{
    el.addEventListener("dragstart", ev=>{ dragId=el.dataset.id; ev.dataTransfer.effectAllowed="move"; setTimeout(()=>el.style.opacity=".4",0); });
    el.addEventListener("dragend", ()=>{ el.style.opacity=""; document.querySelectorAll(".day").forEach(d=>d.classList.remove("drop-hot")); });
  });
  document.querySelectorAll(".day").forEach(col=>{
    col.addEventListener("dragover", ev=>{ ev.preventDefault(); col.classList.add("drop-hot"); });
    col.addEventListener("dragleave", ()=> col.classList.remove("drop-hot"));
    col.addEventListener("drop", ev=>{
      ev.preventDefault(); col.classList.remove("drop-hot");
      if(!dragId) return;
      const s = state.sessions.find(x=>x.id===dragId);
      if(s && s.date!==col.dataset.date){ s.date=col.dataset.date; render(); toast("Séance replanifiée"); }
      dragId=null;
    });
  });
}
function calShift(n){ state.ui.calWeek = addDays(state.ui.calWeek||mondayOf(today()), n); render(); }

function collectFromDOM(){

function weeklyVolumeSeries(){

/* --- graphiques SVG --- */
function lineChart(series, unit){
  const W=680,H=220,pad=36, padL=46;
  const xs=series.map((p,i)=>i), ys=series.map(p=>p.v);
  const minY=Math.min(...ys), maxY=Math.max(...ys);
  const lo=Math.floor((minY-2)/5)*5, hi=Math.ceil((maxY+2)/5)*5, span=Math.max(1,hi-lo);
  const n=series.length;
  const px=i=> n<=1 ? padL+(W-padL-pad)/2 : padL + (W-padL-pad)*(i/(n-1));
  const py=v=> pad + (H-pad*2)*(1-(v-lo)/span);
  const pts=series.map((p,i)=>[px(i),py(p.v)]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=`M ${px(0)} ${H-pad} `+pts.map(p=>"L "+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")+` L ${px(n-1)} ${H-pad} Z`;
  const gridY=[0,.25,.5,.75,1].map(f=>{ const v=lo+span*f; const y=py(v); return `<line x1="${padL}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="var(--border)" stroke-width="1"/><text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--faint)" font-family="var(--mono)">${Math.round(v)}</text>`; }).join("");
  const dots=pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===n-1?4.5:3}" fill="${i===n-1?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/>`).join("");
  const lastLbl = `<text x="${px(n-1)}" y="${py(series[n-1].v)-11}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent-text)" font-family="var(--mono)">${series[n-1].v}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe 1RM estimé">
    ${gridY}
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#lg)"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${lastLbl}
  </svg>`;
}
function barChart(series){
  const W=680,H=200,pad=30,padL=44;
  const ys=series.map(s=>s.v), maxY=Math.max(...ys,1);
  const hi=Math.ceil(maxY/1000)*1000||1000;
  const n=series.length, bw=(W-padL-pad)/n*0.62, gap=(W-padL-pad)/n;
  const by=v=> pad + (H-pad*2)*(1-v/hi);
  const bars=series.map((s,i)=>{
    const x=padL+gap*i+(gap-bw)/2, y=by(s.v), h=(H-pad)-y;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="3" fill="var(--accent)" opacity="${i===n-1?1:.62}"/>
      <text x="${(x+bw/2).toFixed(1)}" y="${H-pad+13}" text-anchor="middle" font-size="9.5" fill="var(--faint)" font-family="var(--mono)">${fmtShort(s.d)}</text>`;
  }).join("");
  const gridY=[0,.5,1].map(f=>{ const v=hi*f, y=by(v); return `<line x1="${padL}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="var(--border)"/><text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--faint)" font-family="var(--mono)">${Math.round(v/1000)}t</text>`; }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Volume hebdomadaire">${gridY}${bars}</svg>`;
}
function emptyChart(msg){ return `<div class="empty" style="padding:30px 12px"><div class="big">📊</div><span style="font-size:13px">${msg}</span></div>`; }

function renderPlan(){
  const cur = currentPhaseInfo();
  const start = state.profile.planStart;
  let acc=0;
  const rows = PHASES.map(p=>{
    const from = p.weeks? addDays(start, acc*7): addDays(start, acc*7);
    const to = p.weeks? addDays(start,(acc+p.weeks)*7-1): null;
    const active = cur.phase===p;
    const html=`<div class="phase ${active?'active':''}">
      <div class="between wrap">
        <div><b style="font-size:15.5px">${p.name}</b> ${active?'<span class="pill accent" style="font-size:9px;margin-left:6px">EN COURS</span>':''}
          <div class="mono" style="font-size:12px;color:var(--accent-text);margin-top:2px">${p.scheme}</div>
        </div>
        <span class="pill plain">${p.weeks?`${p.weeks} sem · ${fmtShort(from)}→${fmtShort(to)}`:"continu (saison)"}</span>
      </div>
      <p class="muted" style="font-size:13.5px;margin:6px 0 0">${p.desc}</p>
    </div>`;
    acc+=p.weeks;
    return html;
  }).join('<div style="height:14px"></div>');

  const tpl=templateSessions();

  return `
  <div class="grid">
    <div><div class="eyebrow">Plan périodisé — fondé sur la recherche</div><h1 style="font-size:24px">Bloc intersaison · force maximale + prévention</h1>
      <p class="muted" style="margin:8px 0 0;max-width:60ch">Structure validée par la littérature (Rønnestad, Vikmoen) : préparation → force lourde ≥ 80 % 1RM → conversion en puissance, puis maintien 1×/sem en saison. 2 séances/semaine. Concentrique explosif sur les charges lourdes.</p>
    </div>

    <div class="card pad">
      <div class="between wrap">
        <label class="field" style="min-width:170px">Début du bloc<input type="date" id="planStart" value="${start}"></label>
        <div class="row wrap" style="gap:8px;align-self:flex-end">
          <button class="btn primary" onclick="generatePlan()">⚡ Générer les séances au calendrier</button>
          <button class="btn ghost danger sm" onclick="clearGenerated()">Effacer les séances planifiées non faites</button>
        </div>
      </div>
      <p class="muted" style="font-size:12.5px;margin:10px 0 0">Crée automatiquement 2 séances muscu/semaine (${state.profile.muscuDays.map(d=>DOW[d]).join(" & ")}) sur toute la durée du bloc, avec le schéma de la phase. Tu ajustes ensuite par glisser-déposer.</p>
    </div>

    <div class="card pad">${rows}</div>

    <div class="grid" style="grid-template-columns:1fr 1fr;gap:14px" id="tplCols">
      ${planTemplateCard(tpl.A)}
      ${planTemplateCard(tpl.B)}
    </div>
    <p class="muted" style="font-size:12.5px">📚 Base scientifique complète dans <span class="kbd">content/muscu-cyclisme/RECHERCHE-scientifique.md</span> du dépôt.</p>
  </div>
  <style>@media(max-width:680px){#tplCols{grid-template-columns:1fr !important}}</style>
  `;
}
function planTemplateCard(t){
  return `<div class="card pad">
    <h3 style="font-size:16px">${escapeHtml(t.label)}</h3>
    <ul class="list-clean" style="margin-top:10px">
      ${t.exos.map(id=>{const e=exById(id);return `<li class="between" style="border-bottom:1px solid var(--border);padding-bottom:6px"><span>${escapeHtml(e?.name||id)}</span><span class="pill ${e?.cat==='force'?'accent':'plain'}" style="font-size:9px">${e?.cat==='force'?'Force':'Prév.'}</span></li>`;}).join("")}
    </ul>
  </div>`;
}
function generatePlan(){
  const sd=document.getElementById("planStart"); if(sd&&sd.value) state.profile.planStart=sd.value;
  const start=state.profile.planStart;
  const totalWeeks=PHASES.reduce((a,p)=>a+p.weeks,0);
  const tpl=templateSessions();
  const days=state.profile.muscuDays;
  let created=0;
  for(let w=0; w<totalWeeks; w++){
    const wkStart=addDays(start, w*7);
    days.forEach((dow,idx)=>{
      const date=addDays(wkStart,dow);
      // évite doublon si une séance muscu existe déjà ce jour
      if(state.sessions.some(s=>s.date===date&&s.type==="muscu")) return;
      const key=idx%2===0?"A":"B";
      const t=tpl[key];
      state.sessions.push({ id:uid(), date, type:"muscu", status:"planned", title:t.label,
        entries:t.exos.map(id=>({exerciseId:id, sets:defaultSetsForDate(id,date)})),
        wellness:{sleep:null,fatigue:null,mood:null,notes:""}, generated:true, createdAt:Date.now() });
      created++;
    });
  }
  save(); toast(`${created} séances générées 🗓️`);
  currentTab="calendar"; state.ui.calWeek=mondayOf(start);
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.tab==="calendar"));
  render();
}
function defaultSetsForDate(exId,date){
  const daysIn=Math.floor((parseISO(date)-parseISO(state.profile.planStart))/86400000);
  let acc=0, phase=PHASES[0];
  for(const p of PHASES){ if(p.weeks===0){phase=p;break;} if(daysIn<(acc+p.weeks)*7){phase=p;break;} acc+=p.weeks; }
  const ex=exById(exId);
  const reps= phase.key==="force"?5 : phase.key==="prepa"?10 : phase.key==="conversion"?4 : 4;
  const n= ex&&ex.cat==="prevention"?3:3;
  return Array.from({length:n},()=>({weight:"",reps:ex&&ex.weighted?reps:"",rpe:"",rir:""}));
}
function clearGenerated(){
  const before=state.sessions.length;
  state.sessions=state.sessions.filter(s=>!(s.generated&&s.status==="planned"));
  save(); render(); toast(`${before-state.sessions.length} séances retirées`);
}

function mapStravaActivity(a){

    moving_min: sum.moving_time!=null ? Math.round(sum.moving_time/60) : null,
    avg_speed: sum.avg_speed!=null ? +(sum.avg_speed*3.6).toFixed(1) : null,
    effort: sum.relative_effort!=null ? sum.relative_effort : null,
    calories: sum.total_calories!=null ? sum.total_calories : null,
    cadence: sum.avg_cadence!=null ? Math.round(sum.avg_cadence) : null,
    sport: a.sport_type||"Ride",
  };
}

async function callStrava(tool, input){
  if(!stravaAvailable()){ const e=new Error("no-mcp"); e.code="capability_disabled"; throw e; }
  const res = await window.claude.mcp.callTool(STRAVA_SERVER, tool, input);
  let p = res && res.payload;
  if(typeof p === "string"){ try{ p = JSON.parse(p); }catch(_e){} }
  return p;
}

async function syncStrava(btn){
  if(!stravaAvailable()){
    toast("Synchro dispo depuis l'app publiée sur claude.ai (connecteur Strava activé)");
    return;
  }
  const label = btn ? btn.textContent : null;
  if(btn){ btn.disabled=true; btn.textContent="↻ Synchro…"; }
  try{
    const start = addDays(today(), -120);
    const data = await callStrava("list_activities", { first:100, range_start: start+"T00:00:00", ordering:"StartDateLocalDesc" });
    const acts = (data && data.activities) || [];
    let added=0, updated=0, rides=0;
    acts.forEach(a=>{
      if(!RIDE_RE.test(a.sport_type||"")) return;
      rides++;
      const date=(a.start_local||"").slice(0,10); if(!date) return;
      const sv=mapStravaActivity(a);
      let s=state.sessions.find(x=>x.strava && x.strava.id===sv.id);
      if(s){ s.date=date; s.title=a.name||"Sortie vélo"; s.duration=sv.moving_min; s.strava=sv; updated++; }
      else {
        state.sessions.push({ id:uid(), date, type:"velo", status:"done", title:a.name||"Sortie vélo",
          duration:sv.moving_min, entries:[], wellness:{sleep:null,fatigue:null,mood:null,notes:""},
          strava:sv, createdAt:Date.now() });
        added++;
      }
    });
    state.profile.stravaLastSync = Date.now();
    save(); render();
    toast(rides ? `Strava : ${added} ajoutée(s), ${updated} à jour` : "Aucune sortie vélo sur 120 j");
  }catch(err){
    if(btn){ btn.disabled=false; btn.textContent=label; }
    handleStravaError(err);
  }
}

async function importStravaProfile(btn){
  if(!stravaAvailable()){ toast("Disponible depuis l'app publiée sur claude.ai"); return; }
  const label = btn ? btn.textContent : null;
  if(btn){ btn.disabled=true; btn.textContent="…"; }
  try{
    const p = await callStrava("get_athlete_profile", {});
    if(p){
      if(p.weight) state.profile.bodyweight = p.weight;
      if(!state.profile.name && p.first_name) state.profile.name = p.first_name;
      save(); render();
      toast(`Profil importé : ${p.first_name||""} ${p.weight?`· ${p.weight} kg`:""}`.trim());
    } else { if(btn){btn.disabled=false;btn.textContent=label;} toast("Profil vide"); }
  }catch(err){ if(btn){ btn.disabled=false; btn.textContent=label; } handleStravaError(err); }
}

function handleStravaError(err){
  const code = err && err.code;
  const map = {
    needs_reauth:        "Strava déconnecté — reconnecte-le dans claude.ai › Réglages › Connecteurs.",
    server_not_connected:"Ajoute le connecteur Strava dans claude.ai › Réglages › Connecteurs.",
    selection_required:  "Plusieurs comptes Strava — choisis-en un dans l'invite claude.ai puis réessaie.",
    not_in_manifest:     "Accès Strava non autorisé pour cette page.",
    blocked_by_policy:   "Strava est bloqué par la politique de ton organisation.",
    approval_required:   "Cet appel Strava requiert une approbation non disponible ici.",
    server_unavailable:  "Strava momentanément injoignable — réessaie dans un instant.",
    tool_error:          "Strava a renvoyé une erreur sur la requête.",
    not_granted:         "Synchro dispo uniquement dans l'app publiée sur claude.ai.",
    capability_disabled: "Synchro dispo uniquement dans l'app publiée sur claude.ai avec le connecteur.",
  };
  toast("⚠️ " + (map[code] || "Échec de la synchro Strava."));
  console.warn("Strava error", code, err && err.message);
}

/* ============================================================

const modalHost=document.getElementById("modalHost");
function modal(inner){
  modalHost.innerHTML=`<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true">${inner}</div></div>`;
  document.getElementById("ov").addEventListener("mousedown",e=>{ if(e.target.id==="ov") closeModal(); });
  document.body.style.overflow="hidden";
}
function closeModal(){ modalHost.innerHTML=""; document.body.style.overflow=""; editingId=null; }
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&modalHost.innerHTML) closeModal(); });

let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200); }

function escapeHtml(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

/* ---------- thème ---------- */
function applyTheme(t){ if(t) document.documentElement.setAttribute("data-theme",t); localStorage.setItem("pbs_theme",t); }
(function initTheme(){ const saved=localStorage.getItem("pbs_theme"); if(saved) document.documentElement.setAttribute("data-theme",saved); })();
document.getElementById("themeBtn").addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme")
    || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  applyTheme(cur==="dark"?"light":"dark");
});

/* ---------- go ---------- */
render();
</script>
