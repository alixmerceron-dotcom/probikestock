<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La sortie de la semaine — Specialized Tarmac SL9 (feed 1080×1080)</title>
<style>
  :root{
    --ink:#0A0C10; --surface:#12161C; --line:#232B34;
    --lime:#C6F832; --white:#FFFFFF; --muted:#9AA3AF;
    --font:"Helvetica Neue",Arial,"Segoe UI",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#05070a;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--font)}
  .canvas{
    position:relative;width:1080px;height:1080px;overflow:hidden;
    background:radial-gradient(120% 90% at 78% 8%, #1b222c 0%, var(--ink) 55%, #05070a 100%);
    color:var(--white);
  }
  /* faint bike line-art */
  .bike{position:absolute;right:-60px;bottom:40px;width:820px;opacity:.16;stroke:var(--white);fill:none;stroke-width:5}
  .grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:90px 90px;opacity:.10}
  .pad{position:absolute;inset:0;padding:74px 78px;display:flex;flex-direction:column}
  /* header lockup */
  .eyebrow{display:inline-flex;align-items:center;gap:14px;align-self:flex-start;background:var(--lime);color:var(--ink);
    font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:26px;padding:14px 22px;border-radius:6px}
  .eyebrow .dot{width:12px;height:12px;border-radius:50%;background:var(--ink)}
  .week{margin-top:22px;color:var(--muted);font-size:22px;letter-spacing:.32em;text-transform:uppercase;font-weight:700}
  /* title block */
  .mid{margin-top:auto;margin-bottom:auto}
  .kicker{color:var(--lime);font-weight:800;font-size:30px;letter-spacing:.06em;text-transform:uppercase}
  h1{font-size:132px;line-height:.92;font-weight:800;letter-spacing:-.02em;text-transform:uppercase;margin-top:14px}
  h1 span{display:block;color:var(--lime)}
  .sub{margin-top:26px;font-size:34px;color:#E7EBF0;font-weight:500;max-width:760px;line-height:1.25}
  /* stat chips */
  .chips{display:flex;gap:16px;margin-top:40px;flex-wrap:wrap}
  .chip{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 24px}
  .chip b{display:block;font-size:44px;font-weight:800;letter-spacing:-.02em}
  .chip small{color:var(--muted);font-size:20px;text-transform:uppercase;letter-spacing:.12em}
  .chip b .u{color:var(--lime)}
  /* footer signature */
  .foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:26px}
  .brand{display:flex;align-items:center;gap:16px;font-weight:800;font-size:30px;letter-spacing:-.01em}
  .mark{width:46px;height:46px;border-radius:10px;background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:30px}
  .brand em{font-style:normal;color:var(--muted);font-weight:600}
  .tag{color:var(--muted);font-size:22px;letter-spacing:.16em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="canvas">
    <div class="grid"></div>
    <svg class="bike" viewBox="0 0 600 340" aria-hidden="true">
      <circle cx="150" cy="240" r="86"/><circle cx="450" cy="240" r="86"/>
      <path d="M150 240 L300 240 L250 120 L150 240 M300 240 L400 130 L250 120 M400 130 L432 178 L450 240 M400 130 L360 118"/>
      <path d="M250 120 L232 104 M360 118 q26 -20 54 -8"/>
    </svg>
    <div class="pad">
      <div>
        <span class="eyebrow"><span class="dot"></span>La sortie de la semaine</span>
        <div class="week">Semaine du 14 juillet 2026 · Road</div>
      </div>

      <div class="mid">
        <div class="kicker">Specialized</div>
        <h1>Tarmac<span>SL9</span></h1>
        <p class="sub">« Le vélo de route le plus rapide jamais conçu » — présenté à 4 jours du Tour de France.</p>
        <div class="chips">
          <div class="chip"><b>687<span class="u"> g</span></b><small>Cadre taille 56</small></div>
          <div class="chip"><b>6,5<span class="u"> kg</span></b><small>Vélo complet</small></div>
          <div class="chip"><b>−4<span class="u"> W</span></b><small>vs SL8 à 45 km/h</small></div>
        </div>
      </div>

      <div class="foot">
        <div class="brand"><span class="mark">P</span><span>by&nbsp;<em>probikestock</em></span></div>
        <div class="tag">#LaSortieDeLaSemaine</div>
      </div>
    </div>
  </div>
</body>
</html>
